services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nso_calendar
      POSTGRES_USER: nso
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nso_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nso"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: paluigi/nso-calendar:0.2.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nso:${DB_PASSWORD:-nso_dev}@db:5432/nso_calendar
      SCHEDULER_ENABLED: "true"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
