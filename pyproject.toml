[project]
name = "nso-calendar"
version = "0.2.0"
description = "Economic Release Calendar — aggregates NSO and ForexFactory release schedules"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "icalendar>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.32",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
